name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: biblioflow
          auto-update-conda: true
          conda-solver: libmamba
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd packages/biblioflow
          poetry config virtualenvs.create false
          poetry check
          poetry install --extras "dev yaml"

      - name: Run linter checks
        run: makim tests.linter

      - name: Run tests
        run: makim tests.unit

      - name: Install web backend dependencies
        run: |
          python -m pip install fastapi "uvicorn[standard]" python-multipart httpx

      - name: Run web backend tests
        run: makim web.backend.tests

      - name: Install web frontend dependencies
        run: makim web.frontend.install

      - name: Run web frontend checks
        run: |
          makim web.frontend.lint
          makim web.frontend.tests
          makim web.frontend.build

      - name: Install notebook app dependencies
        run: python -m pip install ipywidgets IPython

      - name: Run notebook app tests
        run: makim nb.tests

      - name: Build package
        run: makim package.build

      - name: Build web package with bundled frontend
        run: makim web.package.build

      - name: Build notebook app package
        run: makim nb.package.build

      - name: Build documentation
        run: makim docs.build
