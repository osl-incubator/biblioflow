groups:
  all:
    tasks:
      ci:
        help: Run lint, tests, package build, and docs build
        hooks:
          pre-run:
            - task: tests.linter
            - task: tests.unit
            - task: package.build
            - task: nb.tests
            - task: nb.package.build
            - task: docs.build

  clean:
    tasks:
      tmp:
        help: Clean unnecessary temporary files
        backend: bash
        run: |
          rm -fr build/
          rm -fr dist/
          rm -fr packages/biblioflow/dist/
          rm -fr .eggs/
          rm -f .coverage
          rm -fr htmlcov/
          rm -fr .pytest_cache
          rm -fr .mypy_cache
          rm -fr .ruff_cache
          rm -fr packages/biblioflow/.pytest_cache
          rm -fr packages/biblioflow/.mypy_cache
          rm -fr packages/biblioflow/.ruff_cache
          rm -fr packages/biblioflow-web/backend/dist/
          rm -fr packages/biblioflow-web/backend/.pytest_cache
          rm -fr packages/biblioflow-web/backend/.mypy_cache
          rm -fr packages/biblioflow-web/backend/.ruff_cache
          rm -fr packages/biblioflow-web/frontend/dist/
          rm -fr packages/biblioflow-web/frontend/node_modules/
          rm -fr packages/biblioflow-nb/dist/
          rm -fr packages/biblioflow-nb/.pytest_cache
          rm -fr packages/biblioflow-nb/.mypy_cache
          rm -fr packages/biblioflow-nb/.ruff_cache
          find . -name '*.egg-info' -exec rm -fr {} +
          find . -name '*.egg' -exec rm -f {} +
          find . -name '*.pyc' -exec rm -f {} +
          find . -name '__pycache__' -exec rm -fr {} +
          find . -name '*.pyo' -exec rm -f {} +
          find . -name '*~' -exec rm -f {} +

  docs:
    tasks:
      build:
        help: Build the Quarto documentation website
        backend: bash
        run: |
          mkdir -p .cache/quarto-tmp .cache/quarto-home .cache/deno
          TMPDIR="$PWD/.cache/quarto-tmp" \
            HOME="$PWD/.cache/quarto-home" \
            DENO_DIR="$PWD/.cache/deno" \
            quarto render docs --no-execute-daemon

      render:
        help: Alias for docs.build
        hooks:
          pre-run:
            - task: docs.build

      preview:
        help: Preview the Quarto documentation website locally
        backend: bash
        run: |
          mkdir -p .cache/quarto-tmp .cache/quarto-home .cache/deno
          TMPDIR="$PWD/.cache/quarto-tmp" \
            HOME="$PWD/.cache/quarto-home" \
            DENO_DIR="$PWD/.cache/deno" \
            quarto preview docs

  tests:
    tasks:
      linter:
        help: Run linter tools
        backend: bash
        run: |
          PRE_COMMIT_HOME="${PRE_COMMIT_HOME:-.cache/pre-commit}" \
            pre-commit run --all-files --verbose

      unit:
        help: run tests
        args:
          path:
            help: Specify the location of the tests
            type: string
            default: ""
          params:
            help: Specify parameters to be used for tests
            type: string
            default: "-vv"
        backend: bash
        run: |
          cd packages/biblioflow
          PYTHONPATH=src pytest ${{ args.path }} ${{ args.params }}

      nb:
        help: Run biblioflow-nb tests with 90% coverage gate
        hooks:
          pre-run:
            - task: nb.tests

      ci:
        help: run the same tests executed on CI
        hooks:
          pre-run:
            - task: tests.unit
            - task: tests.nb
            - task: tests.linter
            - task: docs.build

  package:
    tasks:
      build:
        help: Build the package with Poetry
        backend: bash
        run: cd packages/biblioflow && poetry build

  web:
    tasks:
      build:
        help: Build biblioflow-web
        backend: bash
        hooks:
          pre-run:
            - task: web.frontend.build
            - task: web.frontend.copy-to-backend
            - task: web.package.build

      run:
        help: Run the biblioflow-web application
        backend: bash
        hooks:
          pre-run:
            - task: web.build
            - task: web.backend.dev

      backend.tests:
        help: Run biblioflow-web backend tests
        backend: bash
        run: |
          cd packages/biblioflow-web/backend
          PYTHONPATH=src:../../biblioflow/src pytest \
            --cov=biblioflow_web_backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90

      backend.dev:
        help: Run the biblioflow-web backend development server
        args:
          host:
            help: Host interface to bind.
            type: string
            default: "127.0.0.1"
          port:
            help: Port to bind. Use 0 to ask the OS for a random free port.
            type: string
            default: "0"
        backend: bash
        run: |
          cd packages/biblioflow-web/backend
          PYTHONPATH=src:../../biblioflow/src uvicorn biblioflow_web_backend.main:app --reload --host "${{ args.host }}" --port "${{ args.port }}"

      seed.demo:
        help: Seed the biblioflow-web data store with rich demo projects
        backend: python
        args:
          data-dir:
            help: Optional biblioflow-web data directory. Defaults to the app data dir.
            type: string
            default: ""
          reset:
            help: Delete existing demo-seeded projects before creating fresh ones.
            type: string
            default: "true"
        run: |
          import sys
          from pathlib import Path

          sys.path.insert(
              0,
              str(Path("packages/biblioflow-web/backend/scripts").resolve()),
          )
          from seed_demo_data import main

          seed_args = []
          data_dir = "${{ args.data-dir }}"
          reset = "${{ args.reset }}".lower() in {"1", "true", "yes", "y"}
          if data_dir:
              seed_args.extend(["--data-dir", data_dir])
          if reset:
              seed_args.append("--reset")
          main(seed_args)

      backend.package.build:
        help: Build the backend Python package without rebuilding frontend assets
        backend: bash
        run: cd packages/biblioflow-web/backend && poetry build

      frontend.install:
        help: Install frontend dependencies
        backend: bash
        run: cd packages/biblioflow-web/frontend && npm install

      frontend.dev:
        help: Run the frontend development server
        backend: bash
        run: cd packages/biblioflow-web/frontend && npm run dev

      frontend.build:
        help: Build the frontend production assets
        backend: bash
        run: cd packages/biblioflow-web/frontend && npm run build

      frontend.lint:
        help: Run frontend static checks
        backend: bash
        run: cd packages/biblioflow-web/frontend && npm run lint

      frontend.tests:
        help: Run frontend tests
        backend: bash
        run: |
          cd packages/biblioflow-web/frontend
          mkdir -p .tmp-vitest
          TMPDIR="$PWD/.tmp-vitest" npm run test:coverage

      frontend.copy-to-backend:
        help: Copy frontend dist assets into the backend package
        backend: bash
        run: cd packages/biblioflow-web/backend && python scripts/build_frontend.py --skip-install --skip-build

      package.build:
        help: Build the publishable biblioflow-web package with bundled frontend assets
        backend: bash
        run: |
          cd packages/biblioflow-web/backend
          python scripts/build_frontend.py
          poetry build

  nb:
    tasks:
      tests:
        help: Run biblioflow-nb tests
        backend: bash
        run: |
          cd packages/biblioflow-nb
          PYTHONPATH=src:../biblioflow/src pytest \
            --cov=biblioflow_nb \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90

      package.build:
        help: Build the biblioflow-nb package
        backend: bash
        run: cd packages/biblioflow-nb && poetry build

      examples.check:
        help: Validate biblioflow-nb example notebooks are present
        backend: bash
        run: |
          test -f packages/biblioflow-nb/src/biblioflow_nb/examples/quickstart.ipynb
          test -f packages/biblioflow-nb/src/biblioflow_nb/examples/colab_quickstart.ipynb

  release:
    vars:
      app: |
        env npm_config_ignore_scripts=true npx --yes \
        -p semantic-release \
        -p "@semantic-release/commit-analyzer" \
        -p "@semantic-release/release-notes-generator" \
        -p "@semantic-release/changelog" \
        -p "@semantic-release/exec" \
        -p "@semantic-release/github" \
        -p "@semantic-release/git" \
        -p "@google/semantic-release-replace-plugin" \
        semantic-release

    tasks:
      ci:
        help: run semantic release on CI
        run: ${{ vars.app }} --ci

      dry:
        help: run semantic release in dry-run mode
        run: ${{ vars.app }} --dry-run
