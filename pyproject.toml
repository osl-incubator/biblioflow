[project]
name = "biblioflow-dev"
version = "0.1.0"
description = "Development metapackage for the biblioflow monorepo."
readme = "README.md"
authors = [
  { name = "Ivan Ogasawara", email = "ivan.ogasawara@gmail.com" }
]
license = "BSD-3-Clause"
requires-python = ">=3.10,<4"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false
exclude = [
  ".git/*",
  ".env*",
  "build/*",
  "packages/*/dist/*",
]

[tool.poetry.dependencies]
python = ">=3.10,<4"
biblioflow = { path = "packages/biblioflow", develop = true }
biblioflow-web = { path = "packages/biblioflow-web/backend", develop = true }
biblioflow-nb = { path = "packages/biblioflow-nb", develop = true }

[tool.poetry.group.dev.dependencies]
douki = ">=0.12.1"
makim = "==1.29.0"
mypy = ">=1.10"
pre-commit = ">=3"
pytest = ">=8"
pytest-cov = ">=5"
quarto-cli = ">=1.9.0"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = [
  "-ra",
]
testpaths = [
  "packages/biblioflow/tests",
  "packages/biblioflow-web/backend/tests",
  "packages/biblioflow-nb/tests",
]
filterwarnings = [
  "error::RuntimeWarning",
]

[tool.bandit]
exclude_dirs = [
  "build",
  "dist",
  "packages/biblioflow/tests",
  "packages/biblioflow-web/backend/tests",
  "packages/biblioflow-nb/tests",
]
targets = ["packages"]

[tool.vulture]
exclude = [
  "tests",
  "build",
  "dist",
  "packages/*/dist",
]
ignore_decorators = []
ignore_names = []
make_whitelist = true
min_confidence = 80
paths = ["packages"]
sort_by_size = true
verbose = false

[tool.ruff]
target-version = "py310"
line-length = 88
force-exclude = true
src = [
  "packages/biblioflow/src",
  "packages/biblioflow-web/backend/src",
  "packages/biblioflow-nb/src",
]
exclude = [
  "build",
  "dist",
  "docs/.quarto",
  "packages/*/dist",
  "packages/biblioflow-web/frontend/dist",
  "packages/biblioflow-web/frontend/node_modules",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "RUF",
]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"packages/biblioflow/tests/**" = ["D"]
"packages/biblioflow-web/backend/tests/**" = ["D"]
"packages/biblioflow-nb/tests/**" = ["D"]
"packages/biblioflow/src/biblioflow/cli.py" = ["B008"]
"packages/biblioflow-web/backend/src/biblioflow_web_backend/api/routes/uploads.py" = ["B008"]

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
disable_error_code = ["untyped-decorator"]
mypy_path = [
  "packages/biblioflow/src",
  "packages/biblioflow-web/backend/src",
  "packages/biblioflow-nb/src",
]
exclude = [
  "build/",
  "dist/",
  "packages/.*/dist/",
  "packages/biblioflow-web/frontend/",
]

[[tool.mypy.overrides]]
module = [
  "fastapi",
  "fastapi.*",
  "IPython",
  "IPython.*",
  "ipywidgets",
  "uvicorn",
  "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "biblioflow_nb.*",
]
disable_error_code = ["no-untyped-call"]
