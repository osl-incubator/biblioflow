[project]
name = "biblioflow"
version = "0.3.0"  # semantic-release
description = "Python-native workflows for bibliographic metadata, bibliometrics, and science mapping."
readme = "README.md"
requires-python = ">=3.10,<4"
license = "BSD-3-Clause"
authors = [
  { name = "Ivan Ogasawara", email = "ivan.ogasawara@gmail.com" }
]
keywords = [
  "bibliometrics",
  "bibliographic-metadata",
  "science-mapping",
  "literature-review",
  "research-evaluation",
  "open-science",
  "python",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pydantic>=2",
  "prisma-flow >=0.5.0",
  "bibtexparser>=1.4",
  "rispy>=0.9",
  "pyalex>=0.15",
  "habanero>=1.2",
  "pybliometrics>=4",
  "pymedx>=0.5.1",
  "pandas>=2",
  "pyyaml>=6",
  "typst >=0.14.9",
]

[project.urls]
Homepage = "https://github.com/osl-incubator/biblioflow"
Repository = "https://github.com/osl-incubator/biblioflow"
Issues = "https://github.com/osl-incubator/biblioflow/issues"
Documentation = "https://osl-incubator.github.io/biblioflow/"


[tool.poetry.group.dev.dependencies]
quarto-cli = ">=1.9.0"
douki = ">=0.12.1"
pytest  = ">=8"
pytest-cov  = ">=5"
ruff  = ">=0.6"
mypy  = ">=1.10"
pre-commit = ">=3"
makim = "==1.29.0"
click = ">=8"

[project.scripts]
biblioflow = "biblioflow.cli:main"

[build-system]
requires = ["poetry-core>=2"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "biblioflow", from = "src" },
]
include = [
  "src/biblioflow/py.typed",
  "src/biblioflow/reporting/_templates/**/*",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "RUF",
]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/biblioflow/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
