project:
  type: website
  output-dir: ../build

website:
  title: biblioflow
  description: Python-native workflows for bibliographic metadata, bibliometrics, and science mapping.
  site-url: https://osl-incubator.github.io/biblioflow/
  repo-url: https://github.com/osl-incubator/biblioflow
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: true
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: get-started.qmd
        text: Get started
      - href: core-workflows.qmd
        text: Core workflows
      - text: Apps
        menu:
          - href: web-app.qmd
            text: Web app
          - href: notebook-app.qmd
            text: Notebook app
    right:
      - icon: github
        href: https://github.com/osl-incubator/biblioflow
        aria-label: GitHub repository
  sidebar:
    style: docked
    search: true
    contents:
      - section: Overview
        contents:
          - index.qmd
          - get-started.qmd
      - section: User guide
        contents:
          - core-workflows.qmd
      - section: Applications
        contents:
          - web-app.qmd
          - notebook-app.qmd
      - section: Contributors
        contents:
          - development.qmd
          - release.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    grid:
      sidebar-width: 280px
      body-width: 900px
      margin-width: 260px

execute:
  freeze: auto
